<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Введите пароль</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .password-container {
            background: rgba(18, 18, 30, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(108, 99, 255, 0.2);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #6c63ff, #8a84ff);
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .logo-icon i {
            font-size: 30px;
            color: white;
        }

        .logo-area h1 {
            font-size: 28px;
            font-weight: 600;
            color: #8a84ff;
            margin-bottom: 5px;
        }

        .logo-area p {
            color: #a0a0c0;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #c0c0e0;
            font-size: 14px;
            font-weight: 500;
        }

        .password-wrapper {
            position: relative;
        }

        .password-input {
            width: 100%;
            padding: 15px 50px 15px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        .password-input:focus {
            outline: none;
            border-color: #6c63ff;
            background: rgba(108, 99, 255, 0.05);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0a0c0;
            cursor: pointer;
            font-size: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6c63ff 0%, #8a84ff 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 99, 255, 0.3);
        }

        .error-message {
            padding: 12px;
            background: rgba(255, 87, 87, 0.1);
            color: #ff5757;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
            border: 1px solid rgba(255, 87, 87, 0.2);
        }

        .success-message {
            padding: 12px;
            background: rgba(76, 217, 100, 0.1);
            color: #4cd964;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
            border: 1px solid rgba(76, 217, 100, 0.2);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: rgba(160, 160, 192, 0.5);
            font-size: 12px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Стили для спиннера загрузки */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Верификация</h1>
            <p>Введите пароль для доступа к настройкам</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i> Пароль должен содержать минимум 6 символов
        </div>
        
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> Проверка пароля...
        </div>
        
        <!-- ВАЖНО: Используем правильный URL из вашего urlpatterns -->
        <form id="passwordForm" method="POST" action="{% url 'serv_verf_password' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="password"><i class="fas fa-key"></i> Введите пароль</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="password-input" 
                        placeholder="Введите ваш пароль" 
                        required
                        autofocus
                    >
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                <div class="btn-content">
                    <div class="spinner" id="spinner"></div>
                    <i class="fas fa-sign-in-alt"></i>
                    <span id="btnText">Подтвердить пароль</span>
                </div>
            </button>
        </form>
        
        <div class="footer">
            <p><i class="fas fa-shield-alt"></i> Защищенный доступ к настройкам</p>
        </div>
    </div>

    <script>
        // Переключение видимости пароля
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
        
        // Функция для показа/скрытия сообщений
        function showMessage(type) {
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            if (type === 'error') {
                errorMessage.style.display = 'block';
                passwordInput.style.borderColor = '#ff4757';
                setTimeout(() => { 
                    passwordInput.style.borderColor = ''; 
                }, 1000);
            } else if (type === 'success') {
                successMessage.style.display = 'block';
            }
        }
        
        // Функция для показа состояния загрузки
        function setLoadingState(isLoading) {
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const btnIcon = submitBtn.querySelector('.fa-sign-in-alt');
            
            if (isLoading) {
                spinner.style.display = 'block';
                btnIcon.style.display = 'none';
                btnText.textContent = 'Проверка...';
                submitBtn.disabled = true;
            } else {
                spinner.style.display = 'none';
                btnIcon.style.display = 'inline-block';
                btnText.textContent = 'Подтвердить пароль';
                submitBtn.disabled = false;
            }
        }
        
        // Обработчик отправки формы
        const form = document.getElementById('passwordForm');
        
        form.addEventListener('submit', function(e) {
            const password = passwordInput.value;
            
            // Клиентская проверка на минимальную длину
            if (password.length < 1) {
                e.preventDefault();
                showMessage('error');
                passwordInput.focus();
                return;
            }
            
            // Показываем состояние загрузки
            setLoadingState(true);
            
            // Форма отправится на URL 'serv_verf_password'
            // Django обработает POST запрос на /settings/user/chek/
        });
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            // Фокус на поле ввода
            passwordInput.focus();
        });
    </script>
</body>
</html>
