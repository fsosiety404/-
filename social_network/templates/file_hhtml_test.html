<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Quantum</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --accent-blue: #7289da;
            --accent-red: #e74c3c;
            --text-primary: #ffffff;
            --text-secondary: #b9bbbe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 70px;
            height: 70px;
            background: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.8rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
            padding-right: 45px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 40px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
        }

        .error {
            color: var(--accent-red);
            font-size: 0.9rem;
            margin-top: 8px;
            display: none;
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: #677bc4;
        }

        .links {
            text-align: center;
            margin-top: 25px;
            color: var(--text-secondary);
        }

        .links a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Создать аккаунт</h1>
                <p class="subtitle">Присоединяйтесь к Quantum Messenger</p>
            </div>

            <!-- ИСПРАВЛЕННАЯ ФОРМА: -->
            <form id="registerForm" action="/register/" method="POST">
                {% csrf_token %}  <!-- ВАЖНО: CSRF токен -->
                
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Имя пользователя
                    </label>
                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Введите имя пользователя"
                           required
                           minlength="3"
                           maxlength="20">
                    <div class="error" id="usernameError">
                        Имя должно быть от 3 до 20 символов
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email адрес
                    </label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="example@mail.com"
                           required>
                    <div class="error" id="emailError">
                        Введите корректный email
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Не менее 6 символов"
                           required
                           minlength="6">
                    <button type="button" class="toggle-password" data-target="password">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="error" id="passwordError">
                        Пароль должен быть не менее 6 символов
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">
                        <i class="fas fa-lock"></i> Подтвердите пароль
                    </label>
                    <input type="password"
                           id="confirm_password"
                           name="confirm_password"
                           placeholder="Повторите пароль"
                           required>
                    <button type="button" class="toggle-password" data-target="confirm_password">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="error" id="confirmError">
                        Пароли не совпадают
                    </div>
                </div>

                <button type="submit">
                    <i class="fas fa-rocket"></i>
                    Создать аккаунт
                </button>
            </form>

            <div class="links">
                Уже есть аккаунт? <a href="/login-in-acaunt">Войти</a>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const input = document.getElementById(targetId);
                const icon = this.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            let isValid = true;

            document.querySelectorAll('.error').forEach(error => {
                error.style.display = 'none';
            });

            const username = document.getElementById('username').value;
            if (username.length < 3 || username.length > 20) {
                document.getElementById('usernameError').style.display = 'block';
                isValid = false;
            }

            const email = document.getElementById('email').value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }

            const password = document.getElementById('password').value;
            if (password.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }

            const confirmPassword = document.getElementById('confirm_password').value;
            if (password !== confirmPassword) {
                document.getElementById('confirmError').style.display = 'block';
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
